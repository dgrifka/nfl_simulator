# Local commit gate for a repo that will be made public.
#
# Install once per clone (the hook itself lives in the untracked .git/hooks/):
#
#     uv run pre-commit install
#
# Run over the whole tree at any time:
#
#     uv run pre-commit run --all-files
#
# Both hooks are mirrored in CI (.github/workflows/ci.yml, job `safety`), so a
# clone that never ran `pre-commit install` is still caught on push.

repos:
  # Generic secret detection: entropy plus ~150 provider rules. Allowed
  # findings, if any, go in .gitleaksignore with a comment per fingerprint.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Repo-specific gate: absolute home paths and the maintainer's untracked
  # identity patterns, which gitleaks knows nothing about.
  - repo: local
    hooks:
      - id: check-public-safe
        name: public-safety gate (paths, identity strings)
        entry: scripts/check_public_safe.sh
        language: script
        # The script derives its own file list from the index, so it must not
        # be handed pre-commit's; and it has to run even on a commit that
        # stages nothing it would otherwise see.
        pass_filenames: false
        always_run: true
