name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project from lockfile
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        # Network-dependent tests are marked `slow` and skipped in CI.
        run: uv run pytest -q -m "not slow"

  safety:
    # Public-safety gate. Mirrors .pre-commit-config.yaml so a clone that never
    # ran `pre-commit install` is still caught here.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the checked-out tree.
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `if: always()` so a gitleaks finding does not hide a public-safety one;
      # both reports are wanted in the same run.
      - name: Public-safety gate
        if: always()
        # Identity patterns are untracked and absent in CI, so this is the
        # generic pass only: credential markers and absolute home paths.
        run: bash scripts/check_public_safe.sh --all
