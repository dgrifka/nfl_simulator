[project]
name = "nfl-simulator"
version = "0.1.0"
description = "NFL deserve-to-win simulator: re-adjudicate games by neutralizing luck rather than replaying plays."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=1.0",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    # PyMC 6 / ArviZ 1.x — ArviZ 1.x is the DataTree split (arviz-base, arviz-stats,
    # arviz-plots). Code written against the 0.x `az.plot_*` API will not import.
    "pymc>=6.0",
    "arviz>=1.1",
    # PyMC 6 auto-selects nutpie when present; 2-5x faster than the PyMC sampler.
    "nutpie>=0.13",
    # NetCDF backend for DataTree.to_netcdf(); xarray has no writer without it.
    "h5netcdf>=1.3",
    "h5py>=3.11",
    "matplotlib>=3.9",
    # PIL post-processing: the watermark is stamped onto the saved PNG, which is
    # immune to figure-size / dpi / bbox_inches="tight" differences.
    "pillow>=10",
    "plotly>=5.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    # Runs the public-safety gate and gitleaks on every local commit; see
    # .pre-commit-config.yaml. Install the git hook with `uv run pre-commit install`.
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_simulator"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that hit the network or fit a model (deselect with '-m \"not slow\"')",
]
