[project]
name = "nfl-simulator"
version = "2.1.2"
description = "One deserve-to-win number per NFL game, from the plays each team ran."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=1.0",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "pandas>=2.2",
    # The process meter reads scipy directly (the Normal CDF behind the percent,
    # the Student-t fit). It arrives transitively today; naming it here keeps a
    # thinner dependency tree from breaking the meter.
    "scipy>=1.13",
    "matplotlib>=3.9",
    # PIL post-processing: the watermark is stamped onto the saved PNG, which is
    # immune to figure-size / dpi / bbox_inches="tight" differences.
    "pillow>=10",
]

[project.optional-dependencies]
# What the previous model's research scripts import and the process meter does
# not. Nothing under `src/` or `tests/` reads any of these, so an install that
# only scores games no longer pulls a sampler stack in behind it. The scripts
# themselves run at tag v1.4.3; this extra is the environment they name.
research = [
    "scikit-learn>=1.5",
    # PyMC 6 / ArviZ 1.x — ArviZ 1.x is the DataTree split (arviz-base, arviz-stats,
    # arviz-plots). Code written against the 0.x `az.plot_*` API will not import.
    "pymc>=6.0",
    "arviz>=1.1",
    # PyMC 6 auto-selects nutpie when present; 2-5x faster than the PyMC sampler.
    "nutpie>=0.13",
    # NetCDF backend for DataTree.to_netcdf(); xarray has no writer without it.
    "h5netcdf>=1.3",
    "h5py>=3.11",
    "plotly>=5.22",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    # Runs the public-safety gate and gitleaks on every local commit; see
    # .pre-commit-config.yaml. Install the git hook with `uv run pre-commit install`.
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_simulator"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# Stated rather than inferred. Ruff decides first-party by resolving a module to
# a file under `src/`, and the research scripts import modules that exist only at
# tag v1.4.3 (`nfl_simulator.components` and the rest of the retired v1 model).
# Left to inference, those imports become third-party the moment the files go and
# every one of those scripts fails I001 — while the scripts themselves must stay
# byte-identical to v1.4.3, since docs 00-74 cite them as their evidence.
known-first-party = ["nfl_simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that read the local play-by-play cache (deselect with '-m \"not slow\"')",
]
