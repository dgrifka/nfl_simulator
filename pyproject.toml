[project]
name = "nfl-simulator"
version = "0.1.0"
description = "NFL deserve-to-win simulator: re-adjudicate games by neutralizing luck rather than replaying plays."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=1.0",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    # PyMC 6 / ArviZ 1.x — ArviZ 1.x is the DataTree split (arviz-base, arviz-stats,
    # arviz-plots). Code written against the 0.x `az.plot_*` API will not import.
    "pymc>=6.0",
    "arviz>=1.1",
    "matplotlib>=3.9",
    "plotly>=5.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_simulator"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that hit the network or fit a model (deselect with '-m \"not slow\"')",
]
